<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>/* Trên GitHub Pages, trang 404 có thể hiện ở đường dẫn sâu (vd. /Web_Portfolio/a/b): đặt gốc về thư mục web để style.css, app.js vẫn tải đúng */
(function(){var p=location.pathname.split("/");if(/\.github\.io$/i.test(location.hostname)&&p.length>3){var b=document.createElement("base");b.href="/"+p[1]+"/";document.head.appendChild(b)}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mất tín hiệu</title>
<meta name="description" content="Portfolio và CV của một nhà phát triển game indie.">
<meta name="theme-color" content="#0B0918">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem("fx")==="0")document.documentElement.classList.add("fx-off");else if(sessionStorage.getItem("transit"))document.documentElement.classList.add("transit")}catch(e){}</script>
</head>
<body data-page="404">
<main id="main"></main>
<noscript><p style="padding:120px 24px;text-align:center">Trang này cần bật JavaScript để hiển thị.</p></noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
